<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Synara — epilepsy care for students</title>
<meta name="description" content="Medication reminders, seizure tracking, and an emergency safety card in one app built for students with epilepsy." />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#7c4dff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121019" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Synara" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/print.css" media="print" />

<script>
  /* Set the theme before first paint.
     If this ran inside main.js instead, a student who picked dark mode
     would get a full-brightness white flash on every launch — which is
     exactly the thing this app should not do. Small enough to inline. */
  (function () {
    try {
      var saved = JSON.parse(localStorage.getItem('synara.v2') || '{}');
      var theme = saved && saved.settings && saved.settings.theme;
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (e) {
      /* Storage blocked or corrupt — fall through to the OS preference. */
    }
  })();
</script>
</head>
<body>

<a class="skip-link" href="#screen">Skip to content</a>

<div class="app-shell">

  <!-- Bottom tab bar on phones; left sidebar from 900px up. -->
  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>

  <div class="shell-main">
    <header class="appbar" id="appbar"></header>
    <main class="screen" id="screen" tabindex="-1"></main>
  </div>

</div>

<!-- Overlays -->
<div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-label="Welcome to Synara" hidden></div>
<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="emergency" id="emergency" role="dialog" aria-modal="true" aria-label="Emergency seizure card" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Filled by the Safety tab's "Print for school"; only visible on paper. -->
<div class="print-card" id="print-card" aria-hidden="true"></div>

<noscript>
  <div style="padding:24px;font-family:system-ui,sans-serif;line-height:1.6">
    <h1>Synara needs JavaScript</h1>
    <p>This app stores everything on your own device, which it can't do with
    JavaScript turned off. Please enable it and reload.</p>
  </div>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
